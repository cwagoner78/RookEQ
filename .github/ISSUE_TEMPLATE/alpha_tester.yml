name: Alpha tester request
description: Request access to test Rook EQ on Windows.
title: "[Alpha testing] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for volunteering to test Rook EQ. Requests are public. Do not include email addresses, diagnostic logs, license information, or other private data here. Approved testers are invited to a separate private, source-free GitHub repository for the installer and test reports.
  - type: input
    id: daw
    attributes:
      label: DAW and version
      placeholder: "For example: REAPER 7.30"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "For example: Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio interface and driver
      placeholder: "Interface model and ASIO driver/version, if known"
  - type: textarea
    id: focus
    attributes:
      label: What would you test?
      description: Mention the workflows or features you expect to exercise.
      placeholder: "Dynamic bands, Mid/Side processing, automation, sidechain input, interface scaling, presets, or another workflow"
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Alpha testing acknowledgements
      options:
        - label: I understand this is an unfinished 64-bit Windows VST3 build intended for testing, not production sessions.
          required: true
        - label: I understand the installer is currently unsigned and Windows will display a warning.
          required: true
        - label: I will not attach diagnostic log ZIPs to public GitHub issues; accepted testers receive private upload instructions.
          required: true
